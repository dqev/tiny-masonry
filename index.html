<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tiny-masonry</title>
  <meta name="description" content="Zero-dependency, fast masonry layout engine for JavaScript. Under 5KB gzipped." />
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('InterVariable.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 20px;
      font-weight: 470;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      padding: 0;
      margin: 0;
    }

    header.hero {
      text-align: center;
      max-width: 580px;
      margin: 0 auto;
      padding: 72px 20px 48px;
    }

    h1.title {
      font-size: 32px;
      line-height: 38px;
      font-weight: 530;
      letter-spacing: -0.025em;
      margin-bottom: 10px;
      color: #000000;
    }

    p.desc {
      font-size: 15px;
      line-height: 20px;
      font-weight: 470;
      color: #555555;
      margin-bottom: 22px;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 36px;
      padding: 0 16px;
      background: #000000;
      color: #ffffff;
      border-radius: 9999px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      font-weight: 470;
      cursor: pointer;
      user-select: none;
      border: none;
      outline: none;
      transition: opacity 0.15s ease;
    }

    .pill:hover {
      opacity: 0.88;
    }

    .pill-copy {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: #888888;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      height: 36px;
      padding: 0 16px;
      background: #f0f0f0;
      color: #000000;
      border-radius: 9999px;
      text-decoration: none;
      font-size: 15px;
      line-height: 20px;
      font-weight: 470;
      transition: background 0.15s ease;
    }

    .btn:hover {
      background: #e4e4e4;
    }

    main.grid-wrap {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    #grid {
      width: 100%;
    }

    .img-card {
      width: 100%;
      border-radius: 22px;
      overflow: hidden;
      background: #e7e7e7;
      display: block;
    }

    .img-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 22px;
    }
  </style>
</head>
<body>

  <header class="hero">
    <h1 class="title">tiny-masonry</h1>
    <p class="desc">
      Zero-dependency, fast masonry layout engine for JavaScript. Under 5KB gzipped with responsive waterfall layout and virtual scrolling.
    </p>

    <div class="actions">
      <button class="pill" id="installPill" onclick="copyInstall()">
        <span>npm i tiny-masonry</span>
        <span class="pill-copy" id="copyLabel">copy</span>
      </button>
      <a href="https://github.com/dqev/tiny-masonry" class="btn" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.npmjs.com/package/tiny-masonry" class="btn" target="_blank" rel="noopener">npm</a>
      <a href="https://unpkg.com/tiny-masonry/masonry.md" class="btn" target="_blank" rel="noopener">Agent Docs</a>
    </div>
  </header>

  <main class="grid-wrap">
    <div id="grid"></div>
  </main>

  <script src="https://unpkg.com/tiny-masonry/masonry.min.js"></script>
  <script>
    if (typeof Masonry === 'undefined') {
      document.write('<script src="npm/masonry.min.js"><\/script>');
    }
  </script>

  <script>
    var imageItems = [
      { w: 600, h: 420, id: 10 },
      { w: 500, h: 720, id: 16 },
      { w: 550, h: 380, id: 28 },
      { w: 480, h: 640, id: 37 },
      { w: 520, h: 520, id: 42 },
      { w: 600, h: 820, id: 54 },
      { w: 540, h: 360, id: 63 },
      { w: 500, h: 660, id: 71 },
      { w: 520, h: 420, id: 82 },
      { w: 460, h: 620, id: 93 },
      { w: 580, h: 390, id: 104 },
      { w: 490, h: 700, id: 115 },
      { w: 510, h: 510, id: 126 },
      { w: 600, h: 760, id: 137 },
      { w: 530, h: 380, id: 148 },
      { w: 470, h: 630, id: 159 },
      { w: 520, h: 440, id: 170 },
      { w: 480, h: 680, id: 181 },
      { w: 540, h: 360, id: 192 },
      { w: 500, h: 600, id: 203 }
    ];

    var container = document.getElementById('grid');
    var count = 0;

    function createImgCard(item) {
      var card = document.createElement('div');
      card.className = 'img-card';
      card.setAttribute('data-aspect-ratio', item.w + '/' + item.h);
      card.style.aspectRatio = item.w + ' / ' + item.h;

      var img = document.createElement('img');
      img.src = 'https://picsum.photos/id/' + item.id + '/' + Math.round(item.w / 1.4) + '/' + Math.round(item.h / 1.4);
      img.alt = '';
      img.loading = 'lazy';

      img.addEventListener('load', function () {
        if (window.grid) {
          window.grid.refresh();
        }
      });

      card.appendChild(img);
      return card;
    }

    // Seed initial 20 images
    var frag = document.createDocumentFragment();
    imageItems.forEach(function (item) {
      count++;
      frag.appendChild(createImgCard(item));
    });
    container.appendChild(frag);

    // Initialize tiny-masonry grid
    var grid = Masonry.create('#grid', {
      gap: 16,
      columnsCountBreakPoints: {
        0: 1,
        480: 2,
        768: 3,
        1100: 4,
        1440: 5
      },
      transitionDuration: '0.2s',
      virtualRender: false
    });

    window.grid = grid;

    // Infinite scroll
    var isLoading = false;
    function loadMore(n) {
      var newEls = [];
      var batchFrag = document.createDocumentFragment();

      for (var i = 0; i < n; i++) {
        var base = imageItems[count % imageItems.length];
        count++;
        var nextItem = {
          w: base.w,
          h: base.h,
          id: ((base.id + count * 9) % 300) + 10
        };
        var el = createImgCard(nextItem);
        batchFrag.appendChild(el);
        newEls.push(el);
      }

      container.appendChild(batchFrag);
      grid.addItems(newEls);
    }

    window.addEventListener('scroll', function () {
      if (isLoading) return;
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 450) {
        isLoading = true;
        loadMore(10);
        setTimeout(function () {
          isLoading = false;
        }, 120);
      }
    }, { passive: true });

    function copyInstall() {
      var text = 'npm i tiny-masonry';
      var label = document.getElementById('copyLabel');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          if (label) {
            label.textContent = 'copied';
            setTimeout(function () { label.textContent = 'copy'; }, 1800);
          }
        });
      } else {
        var input = document.createElement('input');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        if (label) {
          label.textContent = 'copied';
          setTimeout(function () { label.textContent = 'copy'; }, 1800);
        }
      }
    }
  </script>
</body>
</html>
