<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tiny-masonry</title>
  <meta name="description" content="Zero-dependency, fast masonry layout engine for JavaScript. Under 5KB gzipped." />
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('InterVariable.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --gap: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 20px;
      font-weight: 470;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      padding: var(--gap);
      margin: 0;
    }

    header.hero {
      text-align: center;
      max-width: 580px;
      margin: 0 auto;
      padding: 64px 0 48px;
    }

    h1.title {
      font-size: 32px;
      line-height: 38px;
      font-weight: 530;
      letter-spacing: -0.025em;
      margin-bottom: 10px;
      color: #000000;
    }

    p.desc {
      font-size: 15px;
      line-height: 20px;
      font-weight: 470;
      color: #555555;
      margin-bottom: 22px;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 36px;
      padding: 0 16px;
      background: #000000;
      color: #ffffff;
      border-radius: 9999px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      font-weight: 470;
      cursor: pointer;
      user-select: none;
      border: none;
      outline: none;
      transition: opacity 0.15s ease;
    }

    .pill:hover {
      opacity: 0.88;
    }

    .pill-copy {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: #888888;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      height: 36px;
      padding: 0 16px;
      background: #f0f0f0;
      color: #000000;
      border-radius: 9999px;
      text-decoration: none;
      font-size: 15px;
      line-height: 20px;
      font-weight: 470;
      transition: background 0.15s ease;
    }

    .btn:hover {
      background: #e4e4e4;
    }

    main.grid-wrap {
      width: 100%;
      margin: 0;
      padding: 0 0 60px;
    }

    #grid {
      width: 100%;
    }

    .img-card {
      width: 100%;
      border-radius: 22px;
      overflow: hidden;
      background: #e7e7e7;
      display: block;
    }

    .img-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 22px;
    }
  </style>
</head>
<body>

  <header class="hero">
    <h1 class="title">tiny-masonry</h1>
    <p class="desc">
      Zero-dependency, fast masonry layout engine for JavaScript. Under 5KB gzipped with responsive waterfall layout and virtual scrolling.
    </p>

    <div class="actions">
      <button class="pill" id="installPill" onclick="copyInstall()">
        <span>npm i tiny-masonry</span>
        <span class="pill-copy" id="copyLabel">copy</span>
      </button>
      <a href="https://github.com/dqev/tiny-masonry" class="btn" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.npmjs.com/package/tiny-masonry" class="btn" target="_blank" rel="noopener">npm</a>
      <a href="https://unpkg.com/tiny-masonry/masonry.md" class="btn" target="_blank" rel="noopener">Agent Docs</a>
    </div>
  </header>

  <main class="grid-wrap">
    <div id="grid"></div>
  </main>

  <script src="https://unpkg.com/tiny-masonry/masonry.min.js"></script>
  <script>
    if (typeof Masonry === 'undefined') {
      document.write('<script src="npm/masonry.min.js"><\/script>');
    }
  </script>

  <script>
    var localImages = [
      { src: 'images/1.jpg', w: 600, h: 400 },
      { src: 'images/2.jpg', w: 500, h: 750 },
      { src: 'images/3.jpg', w: 550, h: 380 },
      { src: 'images/4.jpg', w: 480, h: 640 },
      { src: 'images/5.jpg', w: 500, h: 500 },
      { src: 'images/6.jpg', w: 600, h: 850 },
      { src: 'images/7.jpg', w: 540, h: 360 },
      { src: 'images/8.jpg', w: 500, h: 680 },
      { src: 'images/9.jpg', w: 520, h: 420 },
      { src: 'images/10.jpg', w: 460, h: 620 },
      { src: 'images/11.jpg', w: 580, h: 390 },
      { src: 'images/12.jpg', w: 500, h: 700 }
    ];

    var container = document.getElementById('grid');

    function createImgCard(item) {
      var card = document.createElement('div');
      card.className = 'img-card';
      card.setAttribute('data-aspect-ratio', item.w + '/' + item.h);
      card.style.aspectRatio = item.w + ' / ' + item.h;

      var img = document.createElement('img');
      img.src = item.src;
      img.alt = '';
      img.loading = 'lazy';

      img.addEventListener('load', function () {
        if (window.grid) {
          window.grid.refresh();
        }
      });

      card.appendChild(img);
      return card;
    }

    function getRandomImage() {
      return localImages[Math.floor(Math.random() * localImages.length)];
    }

    // Seed initial 24 images
    var frag = document.createDocumentFragment();
    for (var i = 0; i < 24; i++) {
      var item = localImages[i % localImages.length];
      frag.appendChild(createImgCard(item));
    }
    container.appendChild(frag);

    // Initialize tiny-masonry grid
    var grid = Masonry.create('#grid', {
      gap: 10,
      columnsCountBreakPoints: {
        0: 1,
        440: 2,
        720: 3,
        1040: 4,
        1380: 5,
        1720: 6,
        2060: 7
      },
      transitionDuration: '0.2s',
      virtualRender: false
    });

    window.grid = grid;

    // Infinite scroll
    var isLoading = false;
    function loadMore(n) {
      var newEls = [];
      var batchFrag = document.createDocumentFragment();

      for (var i = 0; i < n; i++) {
        var randomItem = getRandomImage();
        var el = createImgCard(randomItem);
        batchFrag.appendChild(el);
        newEls.push(el);
      }

      container.appendChild(batchFrag);
      grid.addItems(newEls);
    }

    window.addEventListener('scroll', function () {
      if (isLoading) return;
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 450) {
        isLoading = true;
        loadMore(10);
        setTimeout(function () {
          isLoading = false;
        }, 120);
      }
    }, { passive: true });

    function copyInstall() {
      var text = 'npm i tiny-masonry';
      var label = document.getElementById('copyLabel');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          if (label) {
            label.textContent = 'copied';
            setTimeout(function () { label.textContent = 'copy'; }, 1800);
          }
        });
      } else {
        var input = document.createElement('input');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        if (label) {
          label.textContent = 'copied';
          setTimeout(function () { label.textContent = 'copy'; }, 1800);
        }
      }
    }
  </script>
</body>
</html>
