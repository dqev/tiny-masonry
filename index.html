<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tiny-masonry</title>
  <meta name="description" content="Zero-dependency, fast masonry layout engine for JavaScript. Under 5KB gzipped." />
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('InterVariable.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #ffffff;
      color: #000000;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 20px;
      font-weight: 470;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      padding: 0;
      margin: 0;
    }

    header.hero {
      text-align: center;
      max-width: 580px;
      margin: 0 auto;
      padding: 72px 20px 44px;
    }

    h1.title {
      font-size: 32px;
      line-height: 38px;
      font-weight: 530;
      letter-spacing: -0.025em;
      margin-bottom: 10px;
      color: #000000;
    }

    p.desc {
      font-size: 15px;
      line-height: 20px;
      font-weight: 470;
      color: #555555;
      margin-bottom: 22px;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 36px;
      padding: 0 16px;
      background: #000000;
      color: #ffffff;
      border-radius: 9999px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      font-weight: 470;
      cursor: pointer;
      user-select: none;
      border: none;
      outline: none;
      transition: opacity 0.15s ease;
    }

    .pill:hover {
      opacity: 0.88;
    }

    .pill-copy {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: #888888;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      height: 36px;
      padding: 0 16px;
      background: #f0f0f0;
      color: #000000;
      border-radius: 9999px;
      text-decoration: none;
      font-size: 15px;
      line-height: 20px;
      font-weight: 470;
      transition: background 0.15s ease;
    }

    .btn:hover {
      background: #e4e4e4;
    }

    main.grid-wrap {
      width: 100%;
      padding: 0 20px 60px;
    }

    #grid {
      width: 100%;
    }

    .card {
      background: #e7e7e7;
      border-radius: 6px;
      width: 100%;
    }
  </style>
</head>
<body>

  <header class="hero">
    <h1 class="title">tiny-masonry</h1>
    <p class="desc">
      Zero-dependency, fast masonry layout engine for JavaScript. Under 5KB gzipped with responsive waterfall layout and virtual scrolling.
    </p>

    <div class="actions">
      <button class="pill" id="installPill" onclick="copyInstall()">
        <span>npm i tiny-masonry</span>
        <span class="pill-copy" id="copyLabel">copy</span>
      </button>
      <a href="https://github.com/dqev/tiny-masonry" class="btn" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.npmjs.com/package/tiny-masonry" class="btn" target="_blank" rel="noopener">npm</a>
      <a href="https://unpkg.com/tiny-masonry/masonry.md" class="btn" target="_blank" rel="noopener">Agent Docs</a>
    </div>
  </header>

  <main class="grid-wrap">
    <div id="grid"></div>
  </main>

  <script src="https://unpkg.com/tiny-masonry/masonry.min.js"></script>
  <script>
    if (typeof Masonry === 'undefined') {
      document.write('<script src="npm/masonry.min.js"><\/script>');
    }
  </script>

  <script>
    var heights = [140, 180, 220, 260, 300, 160, 200, 240, 280, 170, 210, 250, 290];

    function makeCard() {
      var el = document.createElement('div');
      el.className = 'card';
      el.style.height = heights[Math.floor(Math.random() * heights.length)] + 'px';
      return el;
    }

    var container = document.getElementById('grid');

    // Seed initial cards
    for (var i = 0; i < 28; i++) {
      container.appendChild(makeCard());
    }

    var grid = Masonry.create('#grid', {
      gap: 12,
      columnsCountBreakPoints: {
        0: 2,
        600: 3,
        900: 4,
        1200: 5,
        1600: 6
      },
      transitionDuration: 0,
      virtualRender: false
    });

    // Infinite scroll
    var isLoading = false;
    function addBatch(n) {
      var els = [];
      for (var k = 0; k < n; k++) {
        els.push(makeCard());
      }
      grid.addItems(els);
    }

    window.addEventListener('scroll', function () {
      if (isLoading) return;
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) {
        isLoading = true;
        addBatch(12);
        setTimeout(function () {
          isLoading = false;
        }, 80);
      }
    }, { passive: true });

    function copyInstall() {
      var text = 'npm i tiny-masonry';
      var label = document.getElementById('copyLabel');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          if (label) {
            label.textContent = 'copied';
            setTimeout(function () { label.textContent = 'copy'; }, 1800);
          }
        });
      } else {
        var input = document.createElement('input');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        if (label) {
          label.textContent = 'copied';
          setTimeout(function () { label.textContent = 'copy'; }, 1800);
        }
      }
    }
  </script>
</body>
</html>
